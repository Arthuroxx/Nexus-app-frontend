<section class="card">
  <h1 id="login-title" class="title">Bienvenido a Nexus</h1>
  <p class="subtitle">¿Listo para romper tus PR's en el gym?</p>

  <form class="auth-form" (submit)="onSubmit($event)" novalidate>
    @if (feedback(); as message) {
      <p
        class="feedback"
        [class.feedback--error]="message.kind === 'error'"
        [class.feedback--ok]="message.kind === 'success'"
        role="status"
        aria-live="polite"
      >
        {{ message.text }}
      </p>
    }

    <div class="field">
      <label class="field-label" for="email">Correo electrónico</label>
      <div class="control">
        <input
          id="email"
          class="input"
          type="email"
          autocomplete="email"
          placeholder="tu@correo.com"
          [formField]="loginForm.email"
          [attr.aria-invalid]="emailError() ? 'true' : null"
          [attr.aria-describedby]="emailError() ? 'email-error' : null"
        />
      </div>
      @if (emailError(); as error) {
        <p id="email-error" class="field-error">{{ error }}</p>
      }
    </div>

    <div class="field">
      <label class="field-label" for="password">Contraseña</label>
      <div class="control">
        <input
          id="password"
          class="input has-toggle"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          placeholder="••••••••"
          [formField]="loginForm.password"
          [attr.aria-invalid]="passwordError() ? 'true' : null"
          [attr.aria-describedby]="passwordError() ? 'password-error' : null"
        />
        <button
          type="button"
          class="toggle"
          (click)="togglePassword()"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          {{ showPassword() ? 'Ocultar' : 'Ver' }}
        </button>
      </div>
      @if (passwordError(); as error) {
        <p id="password-error" class="field-error">{{ error }}</p>
      }
    </div>

    <div class="row">
      <label class="remember">
        <input type="checkbox" [formField]="loginForm.remember" />
        <span>Mantener sesión iniciada</span>
      </label>
      <a class="forgot" href="#" (click)="$event.preventDefault()">¿Olvidaste tu contraseña?</a>
    </div>

    <button type="submit" class="submit" [disabled]="submitting()">
      <span>{{ submitting() ? 'Ingresando…' : 'Iniciar sesión' }}</span>
      <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path
          d="M3 8h9M8.5 4l4 4-4 4"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </form>

  <p class="signup">¿No tienes cuenta? <a routerLink="/registro">Crear una cuenta</a></p>
</section>
